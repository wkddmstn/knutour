<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6">
  <title>경북대 캠퍼스 퀘스트</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="home">
  <div id="app">
    <header id="topbar">
      <div class="brand">캠퍼스 퀘스트</div>
      <button id="bell-btn" class="icon-btn bell-btn" aria-label="알림">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span id="bell-badge" class="bell-badge hidden">0</span>
      </button>
      <div class="xp">
        <span id="lv">Lv.1</span>
        <span id="score">0 XP</span>
      </div>
      <div class="xpbar"><i id="xpfill"></i></div>
    </header>

    <main>
      <section id="view-onboard" class="view hidden"></section>
      <section id="view-home" class="view hidden"></section>
      <section id="view-rank" class="view hidden"></section>
      <section id="view-me" class="view hidden"></section>

      <!-- 구역 화면: 위쪽 고정 영역(지도·위치상태) + 아래 채팅형 미션 -->
      <section id="view-zone" class="view hidden">
        <div id="zone-top" class="zone-top">
          <div class="zone-bar">
            <button id="btn-back" class="icon-btn" aria-label="구역 목록으로">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h2 id="zone-name"></h2>
            <button id="btn-map" class="text-btn">지도 접기</button>
          </div>
          <div id="map"></div>
          <div id="status" class="pill">위치 확인 중...</div>
          <button id="btn-skip" class="tiny hidden">위치 인증 건너뛰기 (디버그)</button>
        </div>
        <div id="chat"></div>
      </section>
    </main>

    <nav id="tabbar">
      <button data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>미션</span>
      </button>
      <button data-tab="rank">
        <svg viewBox="0 0 24 24"><path d="M6 20v-9M12 20V4M18 20v-6"/></svg>
        <span>랭킹</span>
      </button>
      <button data-tab="me">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        <span>내 정보</span>
      </button>
    </nav>
  </div>

  <div id="fx"></div>
  <div id="modal" class="hidden"></div>
  <div id="notif-panel" class="hidden"></div>
  <pre id="debug" class="hidden"></pre>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
