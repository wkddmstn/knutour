<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6">
  <title>OnCampus</title>
  <link rel="icon" type="image/png" href="img/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="OnCampus">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="home">
  <div id="app">
    <main>
      <section id="view-onboard" class="view hidden"></section>
      <!-- 탭 화면 4개: 홈 · 카메라(사진 찍기 + 도감) · 커뮤니티 · 내 정보 -->
      <section id="view-home" class="view hidden"></section>
      <section id="view-dex" class="view hidden"></section>
      <section id="view-community" class="view hidden"></section>
      <section id="view-board" class="view hidden"></section>     <!-- 커뮤니티 > 자유게시판 / 질문 -->
      <section id="view-me" class="view hidden"></section>

      <!-- 카드 버튼을 눌러야 열리는 상세 화면 -->
      <section id="view-explore" class="view hidden"></section>   <!-- 홈 > 캠퍼스 탐험 지도 > 미션 하러 가기 -->
      <section id="view-rank" class="view hidden"></section>      <!-- 커뮤니티 > 내 순위 > 전체 랭킹 -->

      <!-- 구역 화면: 위쪽 고정 영역(지도·위치상태) + 아래 채팅형 미션 -->
      <section id="view-zone" class="view hidden">
        <div id="zone-top" class="zone-top">
          <div class="zone-bar">
            <button id="btn-back" class="icon-btn" aria-label="장소 목록으로 돌아가기">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h2 id="zone-name"></h2>
            <button id="btn-map" class="text-btn">지도 접기</button>
          </div>
          <div id="map"></div>
          <div id="status" class="pill">위치 확인 중...</div>
          <button id="btn-skip" class="tiny hidden">위치 인증 건너뛰기 (디버그)</button>
        </div>
        <div id="chat"></div>
      </section>
    </main>

    <img id="chat-mascot" src="img/mascot/study.png" alt="크누봇">

    <nav id="tabbar">
      <button data-tab="home">
        <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>홈</span>
      </button>
      <button data-tab="dex">
        <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>카메라</span>
      </button>
      <button data-tab="community">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>커뮤니티</span>
      </button>
      <button data-tab="me">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        <span>내 정보</span>
      </button>
    </nav>
  </div>

  <div id="fx"></div>
  <div id="modal" class="hidden"></div>
  <div id="notif-panel" class="hidden"></div>
  <pre id="debug" class="hidden"></pre>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
