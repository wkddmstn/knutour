<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 경북대학교 캠퍼스 퀘스트</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }
  .admin-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .admin-card h2 { font-size: 15px; margin-bottom: 12px; color: var(--sub); }
  .stat-num { font-size: 36px; font-weight: 800; color: var(--primary); }
  .ann-item { padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .ann-item h3 { font-size: 15px; margin-bottom: 4px; }
  .ann-item p { font-size: 13px; color: var(--sub); white-space: pre-wrap; }
  .ann-item .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .ann-item time { font-size: 12px; color: var(--mute); }
  .ann-item button { color: var(--red); font-size: 13px; font-weight: 600; }
  .post-item { display: flex; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .post-item img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: none; }
  .post-item .post-body { flex: 1; min-width: 0; }
  .post-item .post-body b { font-size: 13px; }
  .post-item .post-body p { font-size: 13px; color: var(--sub); margin: 2px 0; word-break: break-word; }
  .post-item .post-body p.reason { color: var(--red); }
  .post-item .meta button { font-size: 12px; font-weight: 600; margin-left: 10px; }
  .post-item .meta button[data-del-post] { color: var(--red); }
  .zone-progress { padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .zone-progress .zp-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; }
  .zone-progress .zp-mission { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); padding: 3px 0; }
  .rank-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .hidden-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hidden-row:last-child { border-bottom: none; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: var(--line); border-radius: 24px; cursor: pointer; transition: .2s; }
  .switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--primary); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .admin-form input, .admin-form textarea, .admin-form select {
    display: block; width: 100%; padding: 12px; margin-bottom: 8px; border: 1.5px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink); font: inherit; box-sizing: border-box;
  }
  .admin-form textarea { min-height: 90px; resize: vertical; }
  #lock-screen { max-width: 320px; margin: 80px auto; text-align: center; }
  #lock-screen input {
    width: 100%; padding: 14px; margin: 16px 0; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; text-align: center; box-sizing: border-box;
  }
  .hidden { display: none !important; }
  .admin-err { color: var(--red); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
  <div id="lock-screen">
    <h1 style="font-size:20px;font-weight:800">🔒 관리자 페이지</h1>
    <p style="color:var(--sub);font-size:14px">비밀번호를 입력하세요</p>
    <input type="password" id="pw-input" placeholder="비밀번호">
    <button class="btn" id="pw-submit">입장</button>
    <p class="admin-err" id="pw-err"></p>
  </div>

  <div id="admin-app" class="hidden">
    <h1 style="font-size:20px;font-weight:800;margin-bottom:16px">📊 관리자 대시보드</h1>

    <div class="admin-card">
      <h2>가입자 수</h2>
      <div class="stat-num" id="stat-users">-</div>
    </div>

    <div class="admin-card">
      <h2>공지사항 등록</h2>
      <div class="admin-form">
        <input type="text" id="ann-title" placeholder="제목">
        <textarea id="ann-body" placeholder="내용"></textarea>
        <select id="ann-dept">
          <option value="">전체 공지</option>
          <option value="인문대학">인문대학</option>
          <option value="사회과학대학">사회과학대학</option>
          <option value="자연과학대학">자연과학대학</option>
          <option value="경영대학">경영대학</option>
          <option value="공과대학">공과대학</option>
          <option value="IT대학">IT대학</option>
          <option value="농업생명과학대학">농업생명과학대학</option>
          <option value="사범대학">사범대학</option>
          <option value="의과대학">의과대학</option>
          <option value="기타">기타</option>
        </select>
        <button class="btn" id="ann-submit">등록하기</button>
        <p class="admin-err" id="ann-err"></p>
      </div>
    </div>

    <div class="admin-card">
      <h2>공지사항 관리</h2>
      <div id="ann-list">불러오는 중...</div>
    </div>

    <div class="admin-card">
      <h2>커뮤니티 게시판 관리</h2>
      <p style="color:var(--mute);font-size:13px;margin-bottom:10px">부적절한 글이나 사진을 찾아 삭제할 수 있어요.</p>
      <div id="post-list">불러오는 중...</div>
    </div>

    <div class="admin-card">
      <h2>🚩 신고 접수함</h2>
      <p style="color:var(--mute);font-size:13px;margin-bottom:10px">사용자가 신고한 글만 모아서 보여줘요.</p>
      <div id="report-list">불러오는 중...</div>
    </div>

    <div class="admin-card">
      <h2>✨ 히든미션 관리</h2>
      <p style="color:var(--mute);font-size:13px;margin-bottom:10px">끄면 홈 화면에서 즉시 안 보이게 돼요.</p>
      <div id="hidden-list">불러오는 중...</div>
    </div>

    <div class="admin-card">
      <h2>구역/미션 진행 현황</h2>
      <div id="progress-list">불러오는 중...</div>
    </div>

    <div class="admin-card">
      <h2>실시간 랭킹</h2>
      <div id="rank-list">불러오는 중...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
